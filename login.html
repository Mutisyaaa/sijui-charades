<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110F">
  <title>Admin login Â· Sijui Charades</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-heading">
      <a class="brand" href="Index.html">Sijui Charades</a>
      <h1 id="login-heading">Welcome back.</h1>
      <p class="intro">Log in to manage your charades decks and cards.</p>

      <form class="auth-form" action="/api/login" method="post" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <button class="primary" type="submit">Log in</button>
        <p id="formNote" class="form-note" role="status"></p>
      </form>

      <p class="switch-page">Need an account? <a href="signup.html">Create one</a></p>
      <a class="back-home" href="Index.html">â† Back to the game</a>
    </section>
  </main>
  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const note = document.getElementById("formNote");
      const form = event.currentTarget;
      note.textContent = "Signing you inâ€¦";
      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: form.email.value, password: form.password.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Login failed.");
        window.location.href = "admin.html";
      } catch (error) {
        note.textContent = error.message;
      }
      return false;
    }
  </script>
</body>
</html>
