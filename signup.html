<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1512">
  <title>Create account · Sijui Charades</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="signup-heading">
      <a class="brand" href="Index.html"><img src="assets/images/logo.png" alt="" class="auth-logo"> Sijui Charades</a>
      <h1 id="signup-heading">Create account.</h1>
      <p class="intro">Create an admin account to add, edit, and organise your decks.</p>

      <form class="auth-form" action="/api/signup" method="post" onsubmit="return handleSignup(event)">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="displayName" type="text" autocomplete="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        </div>
        <button class="primary" type="submit">Create account</button>
        <p id="formNote" class="form-note" role="status"></p>
      </form>

      <p class="switch-page">Already have an account? <a href="login.html">Log in</a></p>
      <a class="back-home" href="Index.html">← Back to the game</a>
    </section>
  </main>
  <script>
    async function handleSignup(event) {
      event.preventDefault();
      const note = document.getElementById("formNote");
      const form = event.currentTarget;
      note.textContent = "Creating your account…";
      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            displayName: form.displayName.value,
            email: form.email.value,
            password: form.password.value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Signup failed.");
        note.textContent = "Account created. Opening the game…";
        window.setTimeout(() => { window.location.href = "admin.html"; }, 500);
      } catch (error) {
        note.textContent = error.message;
      }
      return false;
    }
  </script>
</body>
</html>
